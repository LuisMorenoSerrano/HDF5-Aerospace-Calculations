# =============================================================================
# Configuración del Generador de Matrices Aeroespaciales
# =============================================================================

# Parámetros de la malla FEM
n_nodes = 5000          # Número de nodos para benchmark (30000 DOF)
dof_per_node = 6        # Grados de libertad por nodo (3 traslación + 3 rotación)
bandwidth = 30          # Ancho de banda de la matriz (conectividad local)

# Propiedades del material (Aluminio aeroespacial)
young_modulus = 70.0e9  # Módulo de Young [Pa]
poisson_ratio = 0.33    # Relación de Poisson
density = 2700.0        # Densidad [kg/m³]
thickness = 0.002       # Espesor típico fuselaje [m]

# Parámetros de las zonas estructurales
# Zona 1: Fuselaje (más rígido)
zone1_stiffness_factor = 1.0
zone1_mass_factor = 2.0

# Zona 2: Alas (flexible)
zone2_stiffness_factor = 0.3
zone2_mass_factor = 0.8

# Zona 3: Cola (intermedio)
zone3_stiffness_factor = 0.6
zone3_mass_factor = 0.3

# Configuración de salida
output_file = results/structural_matrices.h5
compression_level = 6   # Nivel de compresión HDF5 (0-9)

# Configuración de paralelización
num_threads = 4          # Número de threads OpenMP (0 = automático)